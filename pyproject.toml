[project]
name = "autogen-v02-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DarioTek", email = "dmontecastro@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "autogen[openai]<1.0",
    # Windows ships no IANA tz database, so zoneinfo.ZoneInfo("America/New_York")
    # raises ZoneInfoNotFoundError on the host (Docker is unaffected: its check
    # script installs tzdata via `uv run --with tzdata`). No `docker` extra is
    # needed: Phase 3 uses the `docker` CLI, not the docker Python SDK.
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
autogen-v02-lab = "autogen_v02_lab:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
